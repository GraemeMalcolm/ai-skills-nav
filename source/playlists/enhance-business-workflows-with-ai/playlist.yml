title: Enhance business workflows with AI
description: Use Microsoft Copilot to analyze and visualize data, delegate multi-step work, create and refine business content, and improve meeting collaboration.
level: 100
duration: 270 minutes
experience_type: Learning Path
role:
  - Administrator
  - Business User
  - Functional Consultant
  - Solution Architect
  - Technology Manager
  - Business Owner
avatar: matt
prerequisites:
  - Students should have basic functional experience with Microsoft 365 services.
learning_outcomes:
  - By the end of this module, you'll be able to leverage Microsoft Copilot for data analysis and visualization in Excel and employ the Analyst Agent to gather insights and enhance your data presentations.
  - Recognize the security model that applies to Cowork and the known limitations to keep in mind as you work.
  - Use the Researcher agent to gain deeper insights to your questions.
  - By the end of this module, you'll be able to use Microsoft Copilot to follow up on meetings by summarizing email threads, capture real-time insights and automate note taking during meetings, generate post-meeting summaries and action items, draft effective follow-up emails, and leverage Copilot Pages and Notebooks for shared planning and deeper analysis.
  - Apply Microsoft Copilot across data analysis, delegated work, content creation, and meeting collaboration to improve end-to-end business workflows.
modules:
  - analyze-visualize-data-copilot
  - delegate-work-copilot-cowork
  - draft-refine-business-content
  - manage-meetings-collaboration
