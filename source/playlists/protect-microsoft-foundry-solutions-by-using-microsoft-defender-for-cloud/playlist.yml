title: Protect Microsoft Foundry solutions by using Microsoft Defender for Cloud
description: Learn how to secure and govern Microsoft Foundry solutions with Microsoft Defender for Cloud, configure workload protections and guardrails, and secure Foundry environments.
experience_type: Learning Path
role:
  - Security Engineer
  - Developer
prerequisites:
  - Experience securing workloads and data in Azure
  - Familiarity with concepts such as identity and access management, network isolation, and cloud security posture management (CSPM)
  - Basic understanding of how AI workloads use Azure services such as Azure OpenAI or Azure AI Search
learning_outcomes:
  - Summarize how Microsoft Defender for Cloud, Microsoft Purview, Microsoft Entra ID, and Microsoft Foundry create a unified, defense-in-depth strategy for AI security in Azure.
  - Investigate AI-related alerts and incidents in Microsoft Defender XDR.
  - Evaluate guardrail effectiveness and refine configurations for continuous assurance.
  - Enable diagnostic logging for centralized visibility and investigation.
  - Protect Microsoft Foundry solutions by applying integrated security, governance, workload protection, guardrail, access, network, secret-management, and monitoring capabilities.
modules:
  - defender-for-cloud-ai-understand-protections
  - defender-for-cloud-ai-protect-workloads
  - azure-ai-foundry-configure-manage-guardrails
  - azure-ai-foundry-secure-environment
