title: Career cheat sheet
description: Career Cheat Sheet is a practical series focused on helping students and early career professionals build their personal brand and stand out with confidence. Hosted by Karen Ngo, each episode shares simple, actionable strategies to help you define your strengths, communicate your value, and tell your story clearly across networking, interviews, and career growth. From building a Career Walking Deck to using it in real-world conversations, this series gives you the tools to make your experience visible, memorable, and impactful early in your career.
level: 100
duration: 30 minutes
role:
  - Business User
  - Business Leader
  - Student
prerequisites:
  - An interest in career development and willingness to reflect on professional strengths.
  - Familiarity with Microsoft 365 tools, particularly PowerPoint.
learning_outcomes:
  - Define a personal brand and identify the content needed for a career walking deck.
  - Build a career walking deck with Copilot and PowerPoint that communicates your professional value.
  - Use a career walking deck effectively in interviews, networking, and professional conversations.
  - Build and use a career walking deck as a practical personal branding tool.
modules:
  - personal-brand
  - walking-deck
  - use-walking-deck
