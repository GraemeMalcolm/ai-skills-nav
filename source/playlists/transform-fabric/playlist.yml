title: Design and transform analytics data in Microsoft Fabric
description: Choose an appropriate Microsoft Fabric data store, design dimensional models, and transform data using Dataflows Gen2, notebooks, and T-SQL.
level: 200
duration: 314 minutes
experience_type: Learning Path
role:
  - Data Analyst
  - Data Engineer
avatar: inna
prerequisites:
  - Data analytics fundamentals and familiarity with data lakes and warehouses
learning_outcomes:
  - Choose the appropriate data store for a business scenario.
  - Implement slowly changing dimension patterns
  - Load transformed data to lakehouse or warehouse destinations
  - Write and size Delta tables appropriately
  - Implement dimensional tables in a warehouse
  - Design and transform analytics data across Microsoft Fabric stores using dimensional modeling, Dataflows Gen2, notebooks, and T-SQL.
modules:
