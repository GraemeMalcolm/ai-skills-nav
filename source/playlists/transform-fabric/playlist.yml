title: Design and transform analytics data in Microsoft Fabric
description: Choose an appropriate Microsoft Fabric data store, design dimensional models, and transform data using Dataflows Gen2, notebooks, and T-SQL.
level: 200
duration: 314 minutes
experience_type: Learning Path
role:
  - Data Analyst
  - Data Engineer
avatar: inna
prerequisites:
  - Data analytics fundamentals and familiarity with data lakes and warehouses
learning_outcomes:
  - Choose the appropriate Fabric lakehouse, warehouse, or eventhouse for a business scenario.
  - Design fact and dimension tables for analytical workloads.
  - Transform data with Dataflows Gen2 and Power Query.
  - Transform lakehouse data with Spark SQL and PySpark notebooks.
  - Transform warehouse data with T-SQL, views, and stored procedures.
modules:
  - choose-data-store-fabric
  - design-dimensional-models-fabric
  - fabric-transform-data-dataflows
  - fabric-transform-data-notebooks
  - fabric-transform-data-tsql
