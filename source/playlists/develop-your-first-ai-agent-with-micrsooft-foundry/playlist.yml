title: Develop your first AI agent with Microsoft Foundry
description: Preview agent development, then learn to create, configure, test, deploy, and consume an AI agent with Microsoft Foundry.
level: 200
duration: 60 minutes
role:
  - Developer
  - Solution Architect
prerequisites:
