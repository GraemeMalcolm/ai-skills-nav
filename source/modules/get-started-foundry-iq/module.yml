title: Get started with Foundry IQ
description: Learn how to build Foundry IQ knowledge bases that ground AI agents with enterprise data using Azure AI Search, agentic retrieval, ranking, and citations.
modalities:
  - Video
  - Lab
level: 200
duration: 30 minutes
experience_type: Microsoft Official Curriculum
topics:
  - Microsoft Foundry
  - AI agents
  - Foundry IQ
audience:
  - Developer
avatar: anton
prerequisites:
  - Familiarity with AI agents and retrieval-augmented generation concepts
learning_outcomes:
  - Explain how Microsoft Foundry IQ provides a managed knowledge layer for agents.
  - Describe Foundry IQ components and the agentic retrieval architecture.
  - Configure knowledge bases that connect to enterprise knowledge sources.
  - Connect an AI agent to a Foundry IQ knowledge base through MCP.
  - Complete an exercise that grounds agent responses in enterprise knowledge.
  - Summarize the Foundry IQ workflow for knowledge-grounded agents.
  - Build and ground AI agents with enterprise knowledge using Microsoft Foundry IQ.
