title: Get started with Foundry IQ
description: Learn how to build Foundry IQ knowledge bases that ground AI agents with enterprise data using Azure AI Search, agentic retrieval, ranking, and citations.
level: 200
duration: 30 minutes
experience_type: Training module
role:
  - Developer
avatar: anton
prerequisites:
  - Familiarity with AI agents and retrieval-augmented generation concepts
learning_outcomes:
