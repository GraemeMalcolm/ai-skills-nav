title: Optimize generative AI model performance with Microsoft Foundry
description: >-
  Explore complementary strategies to optimize generative AI model performance. Learn how to apply prompt engineering,
  ground your model with RAG, and fine-tune for consistent behavior—and when to combine these approaches.
level: 200
duration: 131 minutes
experience_type: Training module
avatar: anton
role:
  - Data Scientist
  - Developer
prerequisites:
  - Before starting this module, you should be familiar with fundamental AI concepts and services in Azure.
learning_outcomes:
  - >-
    Apply prompt engineering techniques including system messages, few-shot learning, and model parameters to optimize
    model output.
  - Understand when and how to ground a language model using Retrieval Augmented Generation (RAG).
  - Identify when fine-tuning a model improves behavioral consistency.
  - Compare optimization strategies and determine when to combine them.
pages:
  - 1-introduction.md
  - 2-prompt-engineering.md
  - 3-retrieval-augmented-generation.md
  - 4-fine-tune-model.md
  - 5-compare-combine-strategies.md
  - 6-exercise.md
  - 7-knowledge-check.md
  - 8-summary.md
