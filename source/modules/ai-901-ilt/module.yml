title: "Course video: AI-901 - Introduction to AI in Azure"
description: "Build foundational knowledge of artificial intelligence and Azure AI. Explore responsible AI, Microsoft Foundry, generative AI, agents, natural language processing, text analysis, speech, computer vision, multimodal models, and information extraction through the complete AI-901 course video series."
level: 200
duration: 358 minutes
experience_type: Course delivery
