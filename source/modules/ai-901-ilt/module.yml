  - Describe how Microsoft Azure and Microsoft Foundry support AI application development.
  - Explore generative AI models and agents in Azure.
  - Identify natural language processing, speech, and computer vision capabilities.
  - Describe how Azure extracts structured information from documents, audio, and video.
