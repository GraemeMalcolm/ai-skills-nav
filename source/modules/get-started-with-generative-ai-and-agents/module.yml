title: Get started with generative AI and agents in Azure
description: Learn how to use generative AI models and agents with Microsoft Foundry.
level: 100
duration: 58 minutes
experience_type: Training module
topics:
  - Microsoft Foundry
  - Artificial Intelligence
role:
  - Developer
  - Data Scientist
  - Solution Architect
