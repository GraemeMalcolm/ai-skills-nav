title: Develop an AI agent with Microsoft Agent Framework
description: >-
  This module provides engineers with the skills to begin building Microsoft Foundry Agent Service agents with Microsoft
  Agent Framework.
level: 200
duration: 55 minutes
experience_type: Training module
avatar: anton
role:
  - Developer
  - Solution Architect
  - Student
prerequisites:
  - Familiarity with Azure and the Azure portal.
  - >-
    An understanding of generative AI. You can learn more with [Fundamentals of Generative
    AI](/training/modules/fundamentals-generative-ai/).
learning_outcomes:
  - Use Microsoft Agent Framework to connect to a Microsoft Foundry project
  - Create Microsoft Foundry Agent Service agents using the Microsoft Agent Framework SDK
  - Integrate plugin functions with your AI agent
pages:
  - 1-introduction.md
  - 2-understand-semantic-kernel-agents.md
  - 3-create-azure-ai-agent.md
  - 4-add-plugins-to-agent.md
  - 5-exercise.md
  - 6-knowledge-check.md
  - 7-summary.md
