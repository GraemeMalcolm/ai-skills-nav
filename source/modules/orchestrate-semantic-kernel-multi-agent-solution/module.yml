title: Orchestrate a multi-agent solution using the Microsoft Agent Framework
description: >-
  Learn how to use the Microsoft Agent Framework SDK to develop your own AI agents that can collaborate for a
  multi-agent solution.
level: 200
duration: 73 minutes
experience_type: Training module
avatar: anton
role:
  - Developer
  - Solution Architect
  - Student
prerequisites:
  - Familiarity with Azure and the Azure portal.
  - >-
    An understanding of generative AI. You can learn more with [Fundamentals of Generative
    AI](/training/modules/fundamentals-generative-ai/).
learning_outcomes:
  - Build AI agents using the Microsoft Agent Framework SDK
  - Understand how and when to use different orchestration patterns
  - Develop multi-agent solutions
