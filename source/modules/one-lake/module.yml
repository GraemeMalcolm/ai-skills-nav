title: Discover and connect to data in OneLake
description: Browse and connect to data using Microsoft OneLake's unified storage. Discover data across workspaces with the OneLake catalog, create shortcuts to reference existing data, and explore streaming sources in Real-Time hub.
level: 400
duration: 60 minutes
experience_type: Training module
audience:
  - Data Analyst
  - Data Engineer
avatar: inna
prerequisites:
  - Familiarity with data lake or lakehouse concepts
learning_outcomes:
  - Describe OneLake architecture and integration capabilities.
  - Discover and connect to data by using the OneLake catalog and shortcuts.
  - Discover, connect to, and work with data across OneLake using its catalog and shortcuts.
