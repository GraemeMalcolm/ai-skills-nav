title: Integrate your agent with Microsoft 365
description: >-
  Learn how to publish Microsoft Foundry agents to Microsoft Teams and Microsoft 365 Copilot, access workplace data with
  Work IQ, and test your integrated agents.
level: 200
duration: 74 minutes
experience_type: Training module
avatar: anton
role:
  - Developer
  - Solution Architect
prerequisites:
  - Familiarity with Azure and the Azure portal
  - >-
    Experience building agents in Microsoft Foundry (recommended: [Develop AI agents with Microsoft Foundry and Visual
    Studio Code](/training/modules/develop-ai-agents-azure-vs-code/) module)
  - A Microsoft 365 subscription with access to Teams
learning_outcomes:
  - Explain the options for publishing Foundry agents to Microsoft 365
  - Publish an agent from the Foundry portal to Teams and Microsoft 365 Copilot
  - Use Work IQ to access Microsoft 365 data in your agents
  - Test and troubleshoot agents integrated with Microsoft 365
pages:
  - 1-introduction.md
  - 2-understand-publishing-options.md
  - 3-publish-agent-foundry-portal.md
  - 4-agents-toolkit-advanced.md
  - 5-access-m365-data-workiq.md
  - 6-test-iterate-agent.md
  - 7-exercise.md
  - 8-knowledge-check.md
  - 9-summary.md
