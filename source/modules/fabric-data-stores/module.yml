title: Choose data stores in Microsoft Fabric
description: Evaluate lakehouse, warehouse, and eventhouse options to select the appropriate analytical data store for business scenarios in Microsoft Fabric.
level: 300
duration: 60 minutes
experience_type: Microsoft Official Curriculum
topics:
  - Microsoft Fabric
audience:
  - Data Analyst
  - Data Engineer
avatar: inna
prerequisites:
  - Data analytics fundamentals and familiarity with data lakes and warehouses
learning_outcomes:
  - Identify the primary analytical data stores available in Microsoft Fabric.
  - Compare lakehouse, warehouse, and eventhouse scenarios and selection criteria.
  - Evaluate lakehouse capabilities for mixed data, Spark processing, and SQL analytics.
  - Evaluate warehouse capabilities for structured reporting, transactions, and T-SQL workloads.
  - Evaluate eventhouse capabilities for streaming, time-series data, and KQL analysis.
  - Check your understanding of Fabric analytical data store selection.
  - Summarize when to use each analytical data store in Microsoft Fabric.
  - Choose the appropriate Fabric lakehouse, warehouse, or eventhouse for a business scenario.
pages:
  - 01-introduction.md
  - 02-data-stores.md
  - 03-lakehouse.md
  - 04-warehouse.md
  - 05-eventhouse.md
  - 06-knowledge-check.md
  - 07-summary.md
