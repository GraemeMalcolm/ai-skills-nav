title: Get ready to work with Microsoft Copilot
description: Explore how Microsoft Copilot grounds responses in your organizational data and the web across Microsoft 365 apps, discover how agents handle complex multi-step tasks, understand how enterprise data protection and sensitivity labels keep your data secure, and apply a four-element prompting framework to get accurate, useful results.
modalities:
  - Video
level: 100
duration: 30 minutes
experience_type: Training module
audience:
  - Business User
avatar: matt
prerequisites:
  - Familiarity with Microsoft 365 apps and basic generative AI concepts
learning_outcomes:
  - Describe how Copilot works across Microsoft 365 applications.
  - Identify enterprise data protection and security controls for Copilot.
  - Create effective prompts using context, goals, sources, and expectations.
  - Use Microsoft Copilot effectively across Microsoft 365 with grounded responses and purposeful prompts.
