title: Leading at the frontier
description: Leading at the Frontier is an executive conversation series exploring how AI is reshaping work, organizations, and leadership. Hosted by Katy George, Corporate Vice President of Workforce Transformation, and Jeana Jorgensen, Corporate Vice President of Global Skilling at Microsoft, each episode unpacks how leaders can drive AI transformation with confidence across their organization. From redesigning workflows to building AI skills at scale, this series provides practical frameworks grounded in Microsoft's own transformation journey.
modalities:
  - Video
level: 100
duration: 60 minutes
experience_type: Video
role:
  - Business Leader
prerequisites:
  - Leadership or management experience and an interest in organizational AI transformation
learning_outcomes:
  - Identify proven strategies for driving organization-wide AI transformation.
  - Explain the leadership behaviors needed to embrace AI-driven change.
  - Design an approach for building AI skills at organizational scale.
  - Plan AI adoption across teams and business functions.
  - Foster a culture that sustains responsible AI innovation.
  - Lead organizational AI transformation through strategy, skilling, adoption, and culture.
