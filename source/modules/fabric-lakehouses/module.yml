title: Get started with lakehouses in Microsoft Fabric
description: Lakehouses in Microsoft Fabric combine data lake storage flexibility with data warehouse analytical capabilities.
  Learn how to create a lakehouse, ingest and transform data, and query data with SQL and Spark.
level: 100
duration: 58 minutes
experience_type: Training module
avatar: inna
role:
