title: Get started with Azure Databricks
description: Get hands-on with Azure Databricks as you explore lakehouse architecture, Apache Spark, Delta Lake, Unity Catalog, data engineering, analytics, machine learning, and Genie Code.
modalities:
  - Video
  - Lab
level: 200
duration: 40 minutes
experience_type: Microsoft Official Curriculum
topics:
  - Azure Databricks
audience:
  - Developer
  - Data Scientist
  - Data Engineer
avatar: alex
prerequisites:
  - Data engineering fundamentals and familiarity with Apache Spark concepts
learning_outcomes:
