title: Develop your first agent with Microsoft Foundry
description: Learn how to create, configure, test, and deploy an AI agent with Microsoft Foundry using models, instructions, tools, tracing, endpoints, and client applications.
level: 200
duration: 45 minutes
experience_type: Training module
role:
  - Developer
avatar: anton
prerequisites:
  - Foundational knowledge of generative AI and experience using development tools
learning_outcomes:
  - Explain how models, instructions, knowledge, and tools work together in generative AI agents.
  - Describe Microsoft Foundry capabilities for building and managing AI applications.
  - Create and configure an AI agent in Microsoft Foundry.
  - Select developer tools and deployment options for a Foundry agent.
  - Build a client application that communicates with a deployed agent.
  - Create, configure, test, deploy, and consume an AI agent with Microsoft Foundry.
