title: Build knowledge-enhanced AI agents with Foundry IQ
description: >
  Learn how to connect AI agents with enterprise knowledge using Foundry IQ. You'll explore how Retrieval Augmented
  Generation (RAG) solves the knowledge problem for AI agents, discover how Foundry IQ provides a shared knowledge
  platform that multiple agents can access, improve retrieval quality through data optimization, and configure agent
  instructions for consistent, cited responses.
level: 200
duration: 71 minutes
experience_type: Training module
avatar: anton
role:
  - Developer
  - Solution Architect
prerequisites:
  - Basic understanding of Azure cloud services
  - Familiarity with AI and machine learning concepts
learning_outcomes:
  - Explain how RAG solves the knowledge problem by connecting agents to real-time information
  - Describe how Foundry IQ provides a shared knowledge platform that multiple agents can access
  - Configure data sources for knowledge bases including Azure AI Search, Blob Storage, SharePoint, and OneLake
  - Configure agent instructions to control retrieval behavior and ensure consistent citations
  - Test and monitor agent retrieval to maintain quality in production
pages:
