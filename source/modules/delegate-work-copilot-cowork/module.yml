  - 2-choose-right-ai-tool.md
  - 2b-understand-cowork-usage.md
  - 3-how-cowork-works.md
  - 4-write-effective-cowork-requests.md
  - 5-see-cowork-action.md
  - 6-guardrails-limitations-responsible-use.md
  - 6b-exercise-cowork-intro.md
  - 7-knowledge-check.md
  - 8-summary.md
