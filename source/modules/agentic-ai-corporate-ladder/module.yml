title: Is Agentic AI upending the corporate ladder?
description: EY's Global Consulting AI Leader Dan Diasio joins host Molly Wood to discuss how agentic AI is shaping the future of work and how companies can reinvent themselves as AI-first Frontier Firms. Learn how AI is disrupting the consulting industry, why investing in upskilling your employees is now mandatory, and why the right combination of mindset, skill set, and tool set matters more than ever. Listen in to discover practical strategies for leaders to drive transformation and compete with AI-native disruptors.
level: 100
duration: 30 minutes
experience_type: Video
role:
  - Business Leader
  - Business User
prerequisites:
  - Understanding of corporate structures and decision-making processes, and a conceptual awareness of agentic AI.
learning_outcomes:
  - Analyze how agentic AI influences decision-making processes and career progression within organizations.
