title: Get started with AI-powered information extraction in Azure
description: >-
  AI gives you the power to unlock insights from your data. Learn how to use Azure Content Understanding in Foundry
  Tools to extract information from content.
level: 100
duration: 43 minutes
experience_type: Training module
topics:
  - Foundry Tools
  - Microsoft Foundry
  - Artificial Intelligence
role:
  - Developer
avatar: anton
prerequisites:
  - Familiarity with Azure portal
learning_outcomes:
  - Describe Azure Content Understanding and its core purpose
  - Explain how content is processed, from ingestion, to analysis, to structured output
  - Identify supported content types (documents, audio, and video)
  - Use analyzers and schemas to extract structured data
  - Explore and interact with results using Foundry tools and APIs
pages:
  - 1-introduction.md
  - 2-documents.md
  - 3-audio-video.md
  - 4-exercise.md
  - 5-knowledge-check.md
  - 6-summary.md
