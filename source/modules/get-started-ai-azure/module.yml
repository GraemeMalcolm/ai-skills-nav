title: Get started with AI in Azure
description: This module introduces Azure and its capabilities for building AI solutions. Explore the key features and benefits of using Microsoft Foundry for AI development.
modalities:
  - Video
  - Lab
level: 200
duration: 120 minutes
experience_type: Microsoft Official Curriculum
audience:
  - Developer
  - AI Engineer
avatar: anton
prerequisites:
  - Foundational cloud computing knowledge and familiarity with Azure concepts
learning_outcomes:
  - Describe Azure tenants, subscriptions, resource groups, and resources.
  - Identify Azure services used to develop and host AI solutions.
  - Explain how Microsoft Foundry supports AI application and agent development.
  - Locate and use deployment options and endpoints for Foundry resources.
  - Build a foundation for developing AI solutions with Microsoft Foundry on Azure.
pages:
  - 01-introduction.md
  - 02-azure.md
  - 03-develop.md
  - 04-foundry.md
  - 05-endpoints.md
  - 06-exercise.md
  - 07-summary.md
