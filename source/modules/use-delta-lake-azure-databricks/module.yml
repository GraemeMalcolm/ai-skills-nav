title: Manage data with Delta Lake
description: Delta Lake is a data management solution in Azure Databricks providing features including ACID transactions, schema
  enforcement, and time travel ensuring data consistency, integrity, and versioning capabilities.
modalities:
  - Lab
level: 200
duration: 75 minutes
experience_type: Training module
role:
  - Data Analyst
avatar: alex
prerequisites:
  - Before starting this module, you should know how to use Apache Spark in Azure Databricks.
learning_outcomes:
  - What Delta Lake is
  - How to create Delta Tables
  - How to use schema versioning and time travel in Delta Lake
  - How to maintain data integrity with Delta Lake
