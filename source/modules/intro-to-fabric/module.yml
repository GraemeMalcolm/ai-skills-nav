title: Introduction to end-to-end analytics using Microsoft Fabric
description: Discover how Microsoft Fabric can meet your enterprise's analytics needs in one platform. Learn about Microsoft Fabric, how it works, and identify how to use it to analyze data.
level: 200
duration: 60 minutes
experience_type: Training module
audience:
  - Data Analyst
  - Data Engineer
avatar: inna
prerequisites:
  - Foundational data analytics knowledge and awareness of end-to-end analytics workflows
learning_outcomes:
  - Identify Fabric workloads and their roles in the analytics lifecycle.
  - Describe how data roles collaborate in a Fabric environment.
  - Evaluate how Fabric supports analytics and AI scenarios.
  - Understand Microsoft Fabric's unified analytics platform and how it supports data and AI workloads.
