title: Integrate MCP Tools with Azure AI Agents
description: Learn how to connect Azure AI agents to Model Context Protocol (MCP) servers for dynamic tool discovery and execution.
modalities:
  - Video
  - Lab
level: 200
duration: 60 minutes
experience_type: Microsoft Official Curriculum
topics:
  - Model Control Protocol (MCP)
  - Microsoft Foundry
  - AI agents
audience:
  - Developer
avatar: anton
prerequisites:
  - Foundational AI agent development skills and familiarity with APIs
learning_outcomes:
  - Explain how Model Context Protocol (MCP) extends AI agents with external tools.
  - Describe MCP tool discovery, interoperability, security, and centralized management.
  - Configure an MCP server and client to expose and invoke tools.
  - Connect a Microsoft Foundry agent to an MCP server and manage tool approvals.
  - Complete an exercise that adds MCP-hosted tools to an AI agent.
  - Summarize the components and workflow used to integrate agents with MCP tools.
  - Build AI agents that dynamically discover and invoke tools through Model Context Protocol servers.
pages:
