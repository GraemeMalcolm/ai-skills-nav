title: Integrate MCP Tools with Azure AI Agents
description: >-
  Enable dynamic tool access for your Azure AI agents. Learn how to connect MCP-hosted tools and integrate them
  seamlessly into agent workflows.
level: 200
duration: 51 minutes
experience_type: Training module
avatar: anton
role:
  - Developer
  - Solution Architect
  - Student
prerequisites:
  - Experience with deploying generative AI models in Microsoft Foundry.
  - Programming experience.
learning_outcomes:
  - Explain the roles of the MCP server and client in tool discovery and invocation.
  - Wrap MCP tools as asynchronous functions and register them with Azure AI agents.
  - Build an Azure AI agent that dynamically accesses and calls MCP tools during runtime.
