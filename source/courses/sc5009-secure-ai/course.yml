title: Secure AI solutions in the cloud
course_number: SC-5009
credentials:
  - apl-5009
description: In this course, you'll learn how to secure and govern Microsoft Foundry solutions with Microsoft Defender for Cloud, configure workload protections and guardrails, and secure Foundry environments.
experience_type: Microsoft Official Curriculum
role:
  - Security Engineer
  - Developer
prerequisites:
  - Experience securing workloads and data in Azure
  - Familiarity with concepts such as identity and access management, network isolation, and cloud security posture management (CSPM)
  - Basic understanding of how AI workloads use Azure services such as Azure OpenAI or Azure AI Search
learning_outcomes:
  - Protect Microsoft Foundry solutions by applying integrated security, governance, workload protection, guardrail, access, network, secret-management, and monitoring capabilities.
playlists:
  - protect-microsoft-foundry-solutions-by-using-microsoft-defender-for-cloud
