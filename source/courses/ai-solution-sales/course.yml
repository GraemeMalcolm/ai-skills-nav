title: Conducting a customer conversation about AI
description: This course teaches Microsoft technical sales professionals how to conduct a conversation with customers about AI solutions. Learn how to effectively engage with customers, understand their needs, and present frontier Artificial Intelligence solutions that drive business value.
level: 200
duration: 1 day
restricted_to:
  - microsoft.com
experience_type: Technical Workshop
role:
  - Technical Sales Specialist
prerequisites:
  - Technical sales experience and foundational familiarity with cloud computing, AI, and Microsoft 365
learning_outcomes:
  - Conduct informed customer conversations about Microsoft AI solutions, platforms, and application patterns.
  - Present and demonstrate Microsoft Copilot solutions to customers with practical product knowledge.
  - Conduct comprehensive customer conversations about AI and Copilot solutions with technical credibility and business relevance.
playlists:
  - ai-azure-sales
  - ai-copilot-sales
