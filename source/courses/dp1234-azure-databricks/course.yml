title: Analyze data with Azure Databricks
course_number: DP-1234
credentials:
  - Microsoft Certified - Azure Databricks Data Analyst
description: In this course, you'll learn how to analyze data with Azure Databricks. The course explores the capabilities of Azure Databricks and how to use it to process and analyze large datasets. You'll gain hands-on experience in data exploration, transformation, and visualization, as well as best practices for working with big data in the cloud.
level: 200
duration: 2 days
experience_type: Microsoft Official Curriculum
audience:
  - Data Analyst
avatar: alex
prerequisites:
  - Data analysis or engineering experience with basic SQL and Apache Spark familiarity
learning_outcomes:
  - Use Azure Databricks concepts to support integrated data engineering, analytics, and machine learning workloads.
playlists:
  - azure-databricks
