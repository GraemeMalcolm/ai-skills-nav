title: Implement analytics solutions using Microsoft Fabric
course_number: DP-600
credentials:
  - Microsoft Certified - Fabric Analytics Engineer Associate
description: This course covers how to prepare, enrich, and serve data for analysis by consumers such as data analysts, report developers, and AI agents. The course focuses on designing dimensional models and transforming and analyzing data by using dataflows, notebooks, and T-SQL across lakehouses, warehouses, and eventhouses in Microsoft Fabric. You'll learn how to build and optimize semantic models, analyze data, and enforce security and governance across data assets.
