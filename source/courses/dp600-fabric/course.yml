title: Implement analytics solutions using Microsoft Fabric
course_number: DP-600
credentials:
  - Microsoft Certified - Fabric Analytics Engineer Associate
description: This course covers how to prepare, enrich, and serve data for analysis by consumers such as data analysts, report developers, and AI agents. The course focuses on designing dimensional models and transforming data by using dataflows, notebooks, and T-SQL across lakehouses, warehouses, and eventhouses in Microsoft Fabric. The course also covers building and optimizing semantic models, managing the analytics development lifecycle, and enforcing security and governance across data assets.
level: 400
duration: 4 days
series: Microsoft Official Curriculum
topics:
  - Microsoft Fabric
audience:
  - Data Analyst
  - Data Engineer
avatar: inna
playlists:
